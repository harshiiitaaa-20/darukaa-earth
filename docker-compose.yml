version: '3.8'

services:
  # 1. PostgreSQL + PostGIS Spatial Database
  db:
    image: postgis/postgis:15-3.3
    container_name: darukaa_postgis_db
    restart: always
    environment:
      POSTGRES_DB: darukaa_earth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d darukaa_earth"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: darukaa_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/darukaa_earth
      SECRET_KEY: darukaa_earth_super_secret_jwt_key_2026_hackathon
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # 3. React Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: darukaa_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgis_data:
