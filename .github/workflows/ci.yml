name: Darukaa.Earth CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Linting & Pytest Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: darukaa_earth_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install email-validator

      - name: Run Ruff Code Quality Linting
        run: |
          cd backend
          ruff check .

      - name: Run Pytest Suite with Coverage
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/darukaa_earth_test
          SECRET_KEY: test_jwt_secret_key_ci
        run: |
          cd backend
          PYTHONPATH=. python -m pytest -v

  frontend-checks:
    name: Frontend Formatting, Linting & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run Prettier Formatting Check
        run: |
          cd frontend
          npx prettier --check "src/**/*.{js,jsx,css,html}"

      - name: Run ESLint
        run: |
          cd frontend
          npx eslint . --ext js,jsx --max-warnings 0

      - name: Build React Production Bundle
        run: |
          cd frontend
          npm run build
