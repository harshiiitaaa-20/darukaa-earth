services:
  # FastAPI Backend Web Service
  - type: web
    name: darukaa-earth-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt && pip install email-validator
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: darukaa-postgis-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0

  # React Static Site Frontend
  - type: web
    name: darukaa-earth-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: darukaa-earth-backend
          property: url

databases:
  # Managed PostgreSQL + PostGIS Database
  - name: darukaa-postgis-db
    databaseName: darukaa_earth
    user: darukaa_user
    plan: free
